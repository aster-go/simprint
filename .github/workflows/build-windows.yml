name: build-windows

on:
  workflow_call:
    inputs:
      release_id:
        description: Existing draft GitHub Release ID
        required: true
        type: string
      release_tag:
        description: Annotated release tag, for example v0.2.30
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,i686-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production build
        shell: powershell
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "TAURI_UPDATER_PUBLIC_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required"
          }

          Copy-Item "src-tauri/config.example.toml" "src-tauri/config.production.toml" -Force

      - name: Prepare x64 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime x86_64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload x64 fixed-runtime installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch]-full[setup].[ext]
          args: --features production --target x86_64-pc-windows-msvc

      - name: Prepare ARM64 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime aarch64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload ARM64 fixed-runtime installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch]-full[setup].[ext]
          args: --features production --target aarch64-pc-windows-msvc

      - name: Prepare x86 fixed-runtime config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs fixed-runtime i686-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload x86 fixed-runtime installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: fixed-runtime
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch]-full[setup].[ext]
          args: --features production --target i686-pc-windows-msvc

      - name: Prepare x64 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper x86_64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload x64 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch][setup].[ext]
          args: --features production --target x86_64-pc-windows-msvc

      - name: Prepare ARM64 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper aarch64-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload ARM64 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch][setup].[ext]
          args: --features production --target aarch64-pc-windows-msvc

      - name: Prepare x86 embedBootstrapper config
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node deploy/prepare-tauri-config.mjs embedBootstrapper i686-pc-windows-msvc
          node deploy/prepare-version.mjs

      - name: Upload x86 embedBootstrapper installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_NAME: production
          SIMPRINT_WEBVIEW_MODE: embedBootstrapper
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ inputs.release_id }}
          tagName: ${{ inputs.release_tag }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Simprint_[version]_[arch][setup].[ext]
          args: --features production --target i686-pc-windows-msvc
